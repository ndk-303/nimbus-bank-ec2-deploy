services:
  backend:
    image: ${NIMBUS_BACKEND_IMAGE:?Set NIMBUS_BACKEND_IMAGE to a tagged Docker Hub image}
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      FACE_API_BASE_URL: http://face-api:8000
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ${FIREBASE_ADMIN_KEY_PATH:?Set FIREBASE_ADMIN_KEY_PATH to an absolute file path}:/run/secrets/firebase-admin.json:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - face-internal

  face-api:
    image: ${NIMBUS_FACE_IMAGE:?Set NIMBUS_FACE_IMAGE to a tagged Docker Hub image}
    restart: unless-stopped
    volumes:
      - ${FACE_MODEL_PATH:?Set FACE_MODEL_PATH to an absolute directory path}:/opt/face-model:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - face-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 90s
      retries: 3

networks:
  face-internal:
    internal: true
